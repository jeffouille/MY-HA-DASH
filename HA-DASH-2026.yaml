title: HA-DASH-2026
views:
  - title: Home
    path: home
    icon: mdi:home
    theme: Mushroom Shadow
    cards:
      # ==========================================
      # HEADER CARD
      # ==========================================
      - type: custom:stack-in-card
        mode: vertical
        keep:
          outer_padding: false
          margin: true
        cards:
          # Ligne 1 : Météo & statut
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                entity: input_boolean.on_state
                icon: mdi:pine-tree
                icon_color: green
                content: ''
                tap_action:
                  action: more-info
                  entity: weather.forecast_home
                hold_action:
                  action: none
                double_tap_action:
                  action: none
              - type: weather
                entity: weather.forecast_home
                show_conditions: true
                show_temperature: true
                tap_action:
                  action: more-info
                hold_action:
                  action: none
                double_tap_action:
                  action: none
              - type: template
                entity: sensor.salon_exterieur_temperature
                icon: mdi:weather-windy
                icon_color: blue-grey
                content: "{{ states('sensor.paris_stade_lenglen_paris_temperature') }}°"
                tap_action:
                  action: more-info
                hold_action:
                  action: none
                double_tap_action:
                  action: none

          # Ligne 2 : Statuts globaux (Maison, Température, Humidité, Lumières, Médias)
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                entity: input_boolean.on_state
                icon: mdi:home
                icon_color: |-
                  {% if states('sensor.lights_on_count')|int(0) > 0 %}
                    amber
                  {% else %}
                    grey
                  {% endif %}
                tap_action:
                  action: none
                hold_action:
                  action: none
                double_tap_action:
                  action: none
              - type: template
                entity: sensor.salon_temperature
                icon: mdi:thermometer
                icon_color: |-
                  {% set t = states('sensor.salon_temperature')|float(0) %}
                  {% if t < 18 %} blue
                  {% elif t < 20 %} yellow
                  {% elif t < 23 %} orange
                  {% else %} red
                  {% endif %}
                content: "{{ states('sensor.salon_temperature') }}°"
                tap_action:
                  action: more-info
                hold_action:
                  action: none
                double_tap_action:
                  action: none
              - type: template
                entity: sensor.salon_humidite
                icon: mdi:water-percent
                icon_color: light-blue
                content: "{{ states('sensor.salon_humidite') }}%"
                tap_action:
                  action: more-info
                hold_action:
                  action: none
                double_tap_action:
                  action: none
              - type: template
                entity: sensor.lights_on_count
                icon: mdi:lightbulb-group
                icon_color: |-
                  {% if states('sensor.lights_on_count')|int(0) > 0 %}
                    amber
                  {% else %}
                    grey
                  {% endif %}
                content: |-
                  {% if states('sensor.lights_on_count')|int(0) > 0 %}
                    {{ states('sensor.lights_on_count') }}
                  {% endif %}
                tap_action:
                  action: more-info
                hold_action:
                  action: none
                double_tap_action:
                  action: none
              - type: template
                icon: mdi:play
                icon_color: |-
                  {% set c = states.media_player | selectattr('state', 'in', ['on', 'playing', 'idle']) | list | count %}
                  {% if c > 0 %} red {% else %} grey {% endif %}
                content: |-
                  {% set c = states.media_player | selectattr('state', 'in', ['on', 'playing', 'idle']) | list | count %}
                  {% if c > 0 %}{{ c }}{% endif %}
                tap_action:
                  action: none
                hold_action:
                  action: none
                double_tap_action:
                  action: none

          # Ligne 3 : Navigation rapide (Swipe card)
          - type: custom:swipe-card
            mode: vertical
            keep:
              outer_padding: false
              margin: true
              box_shadow: false
              background: false
            cards:
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-entity-card
                    card_mod:
                      style: |
                        ha-card { box-shadow: none; }
                    entity: input_boolean.on_state
                    name: TV
                    icon: mdi:remote
                    icon_color: teal
                    layout: vertical
                    primary_info: none
                    secondary_info: name
                    tap_action:
                      action: more-info
                      entity: media_player.bboxtv
                  - type: custom:mushroom-entity-card
                    card_mod:
                      style: |
                        ha-card { box-shadow: none; }
                    entity: sensor.lights_on_count
                    name: Lights
                    icon: mdi:lamps
                    icon_color: yellow
                    layout: vertical
                    primary_info: none
                    secondary_info: name
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-entity-card
                    card_mod:
                      style: |
                        ha-card { box-shadow: none; }
                    entity: input_boolean.on_state
                    name: Floor
                    icon: mdi:floor-plan
                    icon_color: white
                    layout: vertical
                    primary_info: none
                    secondary_info: name
                    tap_action:
                      action: none
                  - type: custom:mushroom-entity-card
                    card_mod:
                      style: |
                        ha-card { box-shadow: none; }
                    entity: input_boolean.on_state
                    name: Media
                    icon: mdi:television-play
                    icon_color: red
                    layout: vertical
                    primary_info: none
                    secondary_info: name
                    tap_action:
                      action: more-info
                      entity: media_player.marantz_nr1607
                  - type: custom:mushroom-entity-card
                    card_mod:
                      style: |
                        ha-card { box-shadow: none; }
                    entity: input_boolean.on_state
                    name: Clean
                    icon: mdi:vacuum
                    icon_color: cyan
                    layout: vertical
                    primary_info: none
                    secondary_info: name
                    tap_action:
                      action: none
                  - type: custom:mushroom-entity-card
                    card_mod:
                      style: |
                        ha-card { box-shadow: none; }
                    entity: input_boolean.on_state
                    name: Prises
                    icon: mdi:power-socket-eu
                    icon_color: green
                    layout: vertical
                    primary_info: none
                    secondary_info: name
                    tap_action:
                      action: none

      # ==========================================
      # PERSON CARDS
      # ==========================================
      - type: horizontal-stack
        cards:
          # Jeff
          - type: custom:swipe-card
            cards:
              - type: custom:stack-in-card
                cards:
                  - type: custom:mushroom-person-card
                    entity: person.jeff
                    icon_type: entity-picture
                    layout: horizontal
                    primary_info: name
                    secondary_info: state
                    fill_container: true
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-chips-card
                    card_mod:
                      style: |
                        ha-card {
                          --chip-font-size: 0.3em;
                          --chip-icon-size: 0.5em;
                          --chip-border-width: 0;
                          --chip-box-shadow: none;
                          --chip-background: none;
                          --chip-border: none;
                          --chip-spacing: none;
                          --chip-font-weight: bold;
                        }
                    alignment: center
                    chips:
                      - type: template
                        entity: sensor.iphone17projeff_battery_level
                        icon: |-
                          {% set b = states('sensor.iphone17projeff_battery_level')|float(100) %}
                          {% if b < 20 %} mdi:battery-20
                          {% elif b < 50 %} mdi:battery-50
                          {% elif b < 80 %} mdi:battery-80
                          {% else %} mdi:battery
                          {% endif %}
                        icon_color: |-
                          {% set b = states('sensor.iphone17projeff_battery_level')|float(100) %}
                          {% if b < 20 %} red
                          {% elif b < 50 %} orange
                          {% elif b < 80 %} yellow
                          {% else %} green
                          {% endif %}
                        content: "{{ states('sensor.iphone17projeff_battery_level') }}%"
                        tap_action:
                          action: more-info
                      - type: template
                        entity: sensor.iphone17projeff_connection_type
                        icon: mdi:cellphone
                        icon_color: blue
                        content: "{{ states('sensor.iphone17projeff_connection_type') }}"
                        tap_action:
                          action: none

          # Mel
          - type: custom:swipe-card
            cards:
              - type: custom:stack-in-card
                cards:
                  - type: custom:mushroom-person-card
                    entity: person.mel
                    icon_type: entity-picture
                    layout: horizontal
                    primary_info: name
                    secondary_info: state
                    fill_container: true
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-chips-card
                    card_mod:
                      style: |
                        ha-card {
                          --chip-font-size: 0.3em;
                          --chip-icon-size: 0.5em;
                          --chip-border-width: 0;
                          --chip-box-shadow: none;
                          --chip-background: none;
                          --chip-border: none;
                          --chip-spacing: none;
                          --chip-font-weight: bold;
                        }
                    alignment: center
                    chips:
                      - type: template
                        entity: sensor.iphone_de_mel_connection_type
                        icon: mdi:cellphone
                        icon_color: blue
                        content: "{{ states('sensor.iphone_de_mel_connection_type') }}"
                        tap_action:
                          action: none

      # ==========================================
      # ROOM CARDS - ROW 1 : SALON & CUISINE
      # ==========================================
      - type: horizontal-stack
        cards:
          # --- SALON ---
          - type: custom:swipe-card
            cards:
              # Front card
              - type: custom:stack-in-card
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('light.lumieres_salon_dash', 'on') %}
                      background: rgba(255, 152, 0, 0.1);
                      {% endif %}
                    }
                mode: vertical
                keep:
                  outer_padding: false
                cards:
                  - type: custom:mushroom-template-card
                    primary: Salon
                    secondary: ''
                    icon: mdi:sofa
                    layout: horizontal
                    entity: light.lumieres_salon_dash
                    icon_color: |-
                      {% if is_state('light.lumieres_salon_dash', 'on') %} amber {% endif %}
                    tap_action:
                      action: more-info
                    hold_action:
                      action: toggle
                    fill_container: true
                  - type: horizontal-stack
                    cards:
                      - type: custom:button-card
                        entity: light.lumieres_salon_dash
                        icon: mdi:lightbulb-group
                        tap_action:
                          action: toggle
                        state:
                          - operator: default
                            color: grey
                          - value: 'on'
                            color: orange
                        styles:
                          icon:
                            - width: 19px
                          grid:
                            - position: relative
                          card:
                            - border-radius: 50%
                            - width: 40px
                            - height: 40px
                        name: ' '
                      - type: custom:button-card
                        entity: sensor.salon_temperature
                        icon: mdi:thermometer
                        styles:
                          icon:
                            - color: |
                                [[[
                                  let t = parseFloat(states['sensor.salon_temperature'].state);
                                  if (t < 18) return 'rgb(26, 209, 255)';
                                  if (t < 20) return 'rgb(255, 214, 51)';
                                  if (t < 23) return 'rgb(255, 163, 26)';
                                  return 'rgb(255, 51, 51)';
                                ]]]
                            - width: 15px
                            - position: relative
                            - top: 4px
                            - right: 12px
                          card:
                            - border-radius: 80%
                            - width: 40px
                            - height: 40px
                          name:
                            - color: white
                            - font-size: 10px
                            - position: relative
                            - bottom: 10px
                            - left: 5px
                            - font-weight: bold
                        name: |
                          [[[
                            if (!states['sensor.salon_temperature'] || states['sensor.salon_temperature'].state == 'unknown') return '-';
                            return `${states['sensor.salon_temperature'].state}°`;
                          ]]]
                      - type: custom:button-card
                        entity: sensor.salon_humidite
                        icon: mdi:water-percent
                        styles:
                          icon:
                            - color: rgb(77, 166, 255)
                            - width: 15px
                            - position: relative
                            - top: 4px
                            - right: 12px
                          card:
                            - border-radius: 80%
                            - width: 40px
                            - height: 40px
                          name:
                            - color: white
                            - font-size: 10px
                            - position: relative
                            - bottom: 10px
                            - left: 5px
                            - font-weight: bold
                        name: |
                          [[[
                            if (!states['sensor.salon_humidite'] || states['sensor.salon_humidite'].state == 'unavailable') return '-';
                            return `${states['sensor.salon_humidite'].state}%`;
                          ]]]
                      - type: custom:button-card
                        entity: media_player.bboxtv
                        icon: mdi:television
                        tap_action:
                          action: toggle
                        state:
                          - operator: default
                            color: grey
                          - value: 'on'
                            color: rgb(255, 51, 51)
                        styles:
                          icon:
                            - width: 19px
                          card:
                            - border-radius: 50%
                            - width: 40px
                            - height: 40px
                        name: ' '
              # Back card (Quick light toggles)
              - type: custom:stack-in-card
                mode: vertical
                cards:
                  - type: horizontal-stack
                    cards:
                      - type: custom:button-card
                        entity: light.spots_salon
                        icon: mdi:ceiling-light
                        tap_action:
                          action: toggle
                        styles:
                          card:
                            - border-radius: 50%
                            - width: 40px
                            - height: 40px
                        state:
                          - value: 'on'
                            color: orange
                          - operator: default
                            color: grey
                        name: ' '
                      - type: custom:button-card
                        entity: light.salon_lampe_bibliotheque_kajplats
                        icon: mdi:lamp
                        tap_action:
                          action: toggle
                        styles:
                          card:
                            - border-radius: 50%
                            - width: 40px
                            - height: 40px
                        state:
                          - value: 'on'
                            color: orange
                          - operator: default
                            color: grey
                        name: ' '
                      - type: custom:button-card
                        entity: light.salon_bureau_kajplats
                        icon: mdi:desk-lamp
                        tap_action:
                          action: toggle
                        styles:
                          card:
                            - border-radius: 50%
                            - width: 40px
                            - height: 40px
                        state:
                          - value: 'on'
                            color: orange
                          - operator: default
                            color: grey
                        name: ' '
                      - type: custom:button-card
                        entity: light.ikea_salon
                        icon: mdi:floor-lamp
                        tap_action:
                          action: toggle
                        styles:
                          card:
                            - border-radius: 50%
                            - width: 40px
                            - height: 40px
                        state:
                          - value: 'on'
                            color: orange
                          - operator: default
                            color: grey
                        name: ' '

          # --- CUISINE ---
          - type: custom:swipe-card
            cards:
              # Front card
              - type: custom:stack-in-card
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('light.lumieres_cuisine_dash', 'on') %}
                      background: rgba(255, 152, 0, 0.1);
                      {% endif %}
                    }
                mode: vertical
                keep:
                  outer_padding: false
                cards:
                  - type: custom:mushroom-template-card
                    primary: Cuisine
                    secondary: ''
                    icon: mdi:silverware-fork-knife
                    layout: horizontal
                    entity: light.lumieres_cuisine_dash
                    icon_color: |-
                      {% if is_state('light.lumieres_cuisine_dash', 'on') %} amber {% endif %}
                    tap_action:
                      action: more-info
                    hold_action:
                      action: toggle
                    fill_container: true
                  - type: horizontal-stack
                    cards:
                      - type: custom:button-card
                        entity: light.lumieres_cuisine_dash
                        icon: mdi:lightbulb-group
                        tap_action:
                          action: toggle
                        state:
                          - operator: default
                            color: grey
                          - value: 'on'
                            color: orange
                        styles:
                          icon:
                            - width: 19px
                          grid:
                            - position: relative
                          card:
                            - border-radius: 50%
                            - width: 40px
                            - height: 40px
                        name: ' '
                      - type: custom:button-card
                        entity: sensor.temperature_humidite_cuisine_temperature
                        icon: mdi:thermometer
                        styles:
                          icon:
                            - color: |
                                [[[
                                  let t = parseFloat(states['sensor.temperature_humidite_cuisine_temperature'].state);
                                  if (t < 18) return 'rgb(26, 209, 255)';
                                  if (t < 20) return 'rgb(255, 214, 51)';
                                  if (t < 23) return 'rgb(255, 163, 26)';
                                  return 'rgb(255, 51, 51)';
                                ]]]
                            - width: 15px
                            - position: relative
                            - top: 4px
                            - right: 12px
                          card:
                            - border-radius: 80%
                            - width: 40px
                            - height: 40px
                          name:
                            - color: white
                            - font-size: 10px
                            - position: relative
                            - bottom: 10px
                            - left: 5px
                            - font-weight: bold
                        name: |
                          [[[
                            if (!states['sensor.temperature_humidite_cuisine_temperature'] || states['sensor.temperature_humidite_cuisine_temperature'].state == 'unavailable') return '-';
                            return `${states['sensor.temperature_humidite_cuisine_temperature'].state}°`;
                          ]]]
                      - type: custom:button-card
                        entity: sensor.temperature_humidite_cuisine_humidity
                        icon: mdi:water-percent
                        styles:
                          icon:
                            - color: rgb(77, 166, 255)
                            - width: 15px
                            - position: relative
                            - top: 4px
                            - right: 12px
                          card:
                            - border-radius: 80%
                            - width: 40px
                            - height: 40px
                          name:
                            - color: white
                            - font-size: 10px
                            - position: relative
                            - bottom: 10px
                            - left: 5px
                            - font-weight: bold
                        name: |
                          [[[
                            if (!states['sensor.temperature_humidite_cuisine_humidity'] || states['sensor.temperature_humidite_cuisine_humidity'].state == 'unavailable') return '-';
                            return `${states['sensor.temperature_humidite_cuisine_humidity'].state}%`;
                          ]]]
                      - type: custom:button-card
                        color_type: blank-card
              # Back card (Quick light toggles)
              - type: custom:stack-in-card
                mode: vertical
                cards:
                  - type: horizontal-stack
                    cards:
                      - type: custom:button-card
                        entity: light.spots_cuisine
                        icon: mdi:ceiling-light
                        tap_action:
                          action: toggle
                        styles:
                          card:
                            - border-radius: 50%
                            - width: 40px
                            - height: 40px
                        state:
                          - value: 'on'
                            color: orange
                          - operator: default
                            color: grey
                        name: ' '
                      - type: custom:button-card
                        entity: light.leds_cuisine
                        icon: mdi:led-strip-variant
                        tap_action:
                          action: toggle
                        styles:
                          card:
                            - border-radius: 50%
                            - width: 40px
                            - height: 40px
                        state:
                          - value: 'on'
                            color: orange
                          - operator: default
                            color: grey
                        name: ' '
                      - type: custom:button-card
                        color_type: blank-card
                      - type: custom:button-card
                        color_type: blank-card

      # ==========================================
      # ROOM CARDS - ROW 2 : ENTRÉE & SALLE À MANGER
      # ==========================================
      - type: horizontal-stack
        cards:
          # --- ENTRÉE ---
          - type: custom:swipe-card
            cards:
              - type: custom:stack-in-card
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('light.lumieres_entree_dash', 'on') %}
                      background: rgba(255, 152, 0, 0.1);
                      {% endif %}
                    }
                mode: vertical
                keep:
                  outer_padding: false
                cards:
                  - type: custom:mushroom-template-card
                    primary: Entrée
                    secondary: ''
                    icon: mdi:door
                    layout: horizontal
                    entity: light.lumieres_entree_dash
                    icon_color: |-
                      {% if is_state('light.lumieres_entree_dash', 'on') %} amber {% endif %}
                    tap_action:
                      action: more-info
                    hold_action:
                      action: toggle
                    fill_container: true
                  - type: horizontal-stack
                    cards:
                      - type: custom:button-card
                        entity: light.lumieres_entree_dash
                        icon: mdi:lightbulb-group
                        tap_action:
                          action: toggle
                        state:
                          - operator: default
                            color: grey
                          - value: 'on'
