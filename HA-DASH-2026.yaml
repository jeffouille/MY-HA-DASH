                            - font-weight: bold
                        name: |
                          [[[
                            if (!states['sensor.salon_exterieur_temperature'] || states['sensor.salon_exterieur_temperature'].state == 'unavailable') return '-';
                            return `${states['sensor.salon_exterieur_temperature'].state}°`;
