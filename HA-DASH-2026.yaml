                        styles:
                          icon:
                            - width: 19px
                          grid:
                            - position: relative
                          card:
                            - border-radius: 50%
                            - width: 40px
                            - height: 40px
                        name: ' '
                      - type: custom:button-card
                        entity: sensor.porte_entree_temperature
                        icon: mdi:thermometer
                        styles:
                          icon:
                            - color: |
                                [[[
                                  let t = parseFloat(states['sensor.porte_entree_temperature'].state);
                                  if (t < 18) return 'rgb(26, 209, 255)';
                                  if (t < 20) return 'rgb(255, 214, 51)';
                                  if (t < 23) return 'rgb(255, 163, 26)';
                                  return 'rgb(255, 51, 51)';
                                ]]]
                            - width: 15px
                            - position: relative
                            - top: 4px
                            - right: 12px
                          card:
                            - border-radius: 80%
                            - width: 40px
                            - height: 40px
                          name:
                            - color: white
                            - font-size: 10px
                            - position: relative
                            - bottom: 10px
                            - left: 5px
                            - font-weight: bold
                        name: |
                          [[[
                            if (!states['sensor.porte_entree_temperature'] || states['sensor.porte_entree_temperature'].state == 'unavailable') return '-';
                            return `${states['sensor.porte_entree_temperature'].state}°`;
                          ]]]
                      - type: custom:button-card
                        color_type: blank-card
                      - type: custom:button-card
                        color_type: blank-card

          # --- SALLE À MANGER ---
          - type: custom:swipe-card
            cards:
              - type: custom:stack-in-card
                card_mod:
                  style: |
                    ha-card {
                      {% if is_state('light.lumieres_salle_a_manger_dash', 'on') %}
                      background: rgba(255, 152, 0, 0.1);
                      {% endif %}
                    }
                mode: vertical
                keep:
                  outer_padding: false
                cards:
                  - type: custom:mushroom-template-card
                    primary: Salle à manger
                    secondary: ''
                    icon: mdi:table-chair
                    layout: horizontal
                    entity: light.lumieres_salle_a_manger_dash
                    icon_color: |-
                      {% if is_state('light.lumieres_salle_a_manger_dash', 'on') %} amber {% endif %}
                    tap_action:
                      action: more-info
                    hold_action:
                      action: toggle
                    fill_container: true
                  - type: horizontal-stack
                    cards:
                      - type: custom:button-card
                        entity: light.lumieres_salle_a_manger_dash
                        icon: mdi:lightbulb-group
                        tap_action:
                          action: toggle
                        state:
                          - operator: default
                            color: grey
                          - value: 'on'
                            color: orange
                        styles:
                          icon:
                            - width: 19px
                          grid:
                            - position: relative
                          card:
                            - border-radius: 50%
                            - width: 40px
                            - height: 40px
                        name: ' '
                      - type: custom:button-card
                        entity: sensor.salon_temperature
                        icon: mdi:thermometer
                        styles:
                          icon:
                            - color: |
                                [[[
                                  let t = parseFloat(states['sensor.salon_temperature'].state);
                                  if (t < 18) return 'rgb(26, 209, 255)';
                                  if (t < 20) return 'rgb(255, 214, 51)';
                                  if (t < 23) return 'rgb(255, 163, 26)';
                                  return 'rgb(255, 51, 51)';
                                ]]]
                            - width: 15px
                            - position: relative
                            - top: 4px
                            - right: 12px
                          card:
                            - border-radius: 80%
                            - width: 40px
                            - height: 40px
                          name:
                            - color: white
                            - font-size: 10px
                            - position: relative
                            - bottom: 10px
